<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Gesture Command Center — Mobile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="camera-wrap">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div id="hud">
      <div id="status-row">
        <span id="gesture-label">—</span>
        <span id="confidence-badge">0%</span>
      </div>

      <div id="target-row">
        <span class="hud-label">Target:</span>
        <button id="target-toggle" class="toggle-btn" data-target="phone">📱 This phone</button>
      </div>

      <div id="laptop-row" class="hidden">
        <input id="laptop-addr" type="text" placeholder="192.168.1.23:8765"
               autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button id="laptop-connect" class="small-btn">Connect</button>
        <span id="ws-status" class="dim">disconnected</span>
      </div>

      <div id="controls-row">
        <button id="calib-toggle" class="small-btn">Calibrate</button>
        <button id="save-profile" class="small-btn">Save</button>
        <select id="calib-slot" class="hidden">
          <option value="custom_1">custom_1</option>
          <option value="custom_2">custom_2</option>
          <option value="custom_3">custom_3</option>
          <option value="custom_4">custom_4</option>
        </select>
        <button id="calib-record" class="small-btn hidden">● Record</button>
      </div>

      <div id="hint" class="dim">
        ✋ open palm = emergency stop &nbsp;·&nbsp; 🤏 pinch = confirm/click &nbsp;·&nbsp;
        ✊ fist = play/pause &nbsp;·&nbsp; 👍/👎 = volume &nbsp;·&nbsp; 👋 swipe = next/prev
      </div>
    </div>
  </div>

  <!-- MediaPipe Hands (on-device, runs via WASM inside the browser) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script src="feature_extraction.js"></script>
  <script src="gesture_classifier.js"></script>
  <script src="phone_actions.js"></script>
  <script src="ws_client.js"></script>
  <script src="app.js"></script>
</body>
</html>
